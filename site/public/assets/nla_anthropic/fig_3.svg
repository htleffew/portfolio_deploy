<svg viewBox="0 0 760 360" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block;">
  <defs>
    <marker id="nlaUp" markerWidth="9" markerHeight="9" refX="4" refY="7" orient="auto">
      <polygon points="0 8, 4 0, 8 8" fill="#1A4A38"></polygon>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="360" fill="#ffffff"></rect>

  <!-- header -->
  <text x="24" y="32" font-family="JetBrains Mono, SF Mono, Menlo, monospace" font-size="12" letter-spacing="1.2" fill="#030303">AUDITING BENCHMARK GAME: HIDDEN-OBJECTIVE DETECTION</text>
  <line x1="24" y1="42" x2="736" y2="42" stroke="#030303" stroke-width="1"></line>

  <!-- plot geometry: baseline y=300, top y=70, 0..16% over 230px (14.375 px per %) -->
  <line x1="170" y1="70" x2="170" y2="300" stroke="#030303" stroke-width="1.5"></line>
  <line x1="170" y1="300" x2="700" y2="300" stroke="#030303" stroke-width="1.5"></line>

  <!-- gridlines + ticks at 0,5,10,15% -->
  <text x="162" y="304" text-anchor="end" font-family="JetBrains Mono, SF Mono, Menlo, monospace" font-size="10" fill="#030303">0%</text>
  <line x1="170" y1="228.1" x2="700" y2="228.1" stroke="#030303" stroke-width="0.5" opacity="0.25"></line>
  <text x="162" y="232" text-anchor="end" font-family="JetBrains Mono, SF Mono, Menlo, monospace" font-size="10" fill="#030303">5%</text>
  <line x1="170" y1="156.3" x2="700" y2="156.3" stroke="#030303" stroke-width="0.5" opacity="0.25"></line>
  <text x="162" y="160" text-anchor="end" font-family="JetBrains Mono, SF Mono, Menlo, monospace" font-size="10" fill="#030303">10%</text>
  <line x1="170" y1="84.4" x2="700" y2="84.4" stroke="#030303" stroke-width="0.5" opacity="0.25"></line>
  <text x="162" y="88" text-anchor="end" font-family="JetBrains Mono, SF Mono, Menlo, monospace" font-size="10" fill="#030303">15%</text>

  <!-- BAR 1: without NLA < 3% -> use 3% h=43.1 top y=256.9 -->
  <rect x="255" y="256.9" width="110" height="43.1" fill="#030303" opacity="0.55"></rect>
  <text x="310" y="248" text-anchor="middle" font-family="JetBrains Mono, SF Mono, Menlo, monospace" font-size="14" fill="#030303">&lt;3%</text>
  <text x="310" y="320" text-anchor="middle" font-family="JetBrains Mono, SF Mono, Menlo, monospace" font-size="11" fill="#030303">WITHOUT NLA</text>
  <text x="310" y="336" text-anchor="middle" font-family="JetBrains Mono, SF Mono, Menlo, monospace" font-size="9" fill="#030303" opacity="0.7">output-only audit</text>

  <!-- BAR 2: with NLA 12-15% -> solid to 12% (h=172.5 top 127.5), range cap to 15% (top 84.4) -->
  <rect x="505" y="127.5" width="110" height="172.5" fill="#1A4A38"></rect>
  <!-- 12->15% range extension -->
  <rect x="505" y="84.4" width="110" height="43.1" fill="#1A4A38" opacity="0.4"></rect>
  <line x1="505" y1="84.4" x2="615" y2="84.4" stroke="#1A4A38" stroke-width="1.5" stroke-dasharray="4 3"></line>
  <line x1="505" y1="127.5" x2="615" y2="127.5" stroke="#1A4A38" stroke-width="1.25" stroke-dasharray="2 3"></line>
  <text x="560" y="76" text-anchor="middle" font-family="JetBrains Mono, SF Mono, Menlo, monospace" font-size="14" fill="#1A4A38">12&#8211;15%</text>
  <text x="560" y="320" text-anchor="middle" font-family="JetBrains Mono, SF Mono, Menlo, monospace" font-size="11" fill="#1A4A38">WITH NLA</text>
  <text x="560" y="336" text-anchor="middle" font-family="JetBrains Mono, SF Mono, Menlo, monospace" font-size="9" fill="#030303" opacity="0.7">activation readout</text>

  <!-- uplift annotation -->
  <line x1="365" y1="245" x2="500" y2="150" stroke="#1A4A38" stroke-width="1.5" marker-end="url(#nlaUp)"></line>
  <rect x="368" y="178" width="118" height="34" fill="#ffffff" stroke="#1A4A38" stroke-width="1.5"></rect>
  <text x="427" y="192" text-anchor="middle" font-family="JetBrains Mono, SF Mono, Menlo, monospace" font-size="11" fill="#1A4A38">~4&#8211;5&#215; uplift</text>
  <text x="427" y="206" text-anchor="middle" font-family="JetBrains Mono, SF Mono, Menlo, monospace" font-size="8" fill="#030303">zero-knowledge audit</text>

  <!-- footer note -->
  <text x="170" y="352" text-anchor="start" font-family="JetBrains Mono, SF Mono, Menlo, monospace" font-size="9" fill="#030303" opacity="0.75">no access to the misaligned training data used to build the model organism</text>
</svg>
