<svg viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block;">
  <defs>
    <marker id="nlaArrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#030303"></polygon>
    </marker>
    <marker id="nlaArrowGold" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#DBA844"></polygon>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="340" fill="#ffffff"></rect>

  <!-- header -->
  <text x="24" y="32" font-family="JetBrains Mono, SF Mono, Menlo, monospace" font-size="12" letter-spacing="1.5" fill="#030303">NLA = THREE COMPONENTS, ONE TEXT BOTTLENECK</text>
  <line x1="24" y1="42" x2="736" y2="42" stroke="#030303" stroke-width="1"></line>

  <!-- COMPONENT 1: TARGET MODEL (frozen) -->
  <rect x="20" y="84" width="150" height="92" fill="#ffffff" stroke="#0F3A6B" stroke-width="2"></rect>
  <text x="95" y="116" text-anchor="middle" font-family="JetBrains Mono, SF Mono, Menlo, monospace" font-size="12" fill="#0F3A6B">TARGET MODEL</text>
  <text x="95" y="136" text-anchor="middle" font-family="JetBrains Mono, SF Mono, Menlo, monospace" font-size="10" fill="#030303">frozen</text>
  <text x="95" y="152" text-anchor="middle" font-family="JetBrains Mono, SF Mono, Menlo, monospace" font-size="9" fill="#030303" opacity="0.7">read, not modified</text>

  <!-- arrow: activation h -->
  <line x1="170" y1="130" x2="208" y2="130" stroke="#030303" stroke-width="1.5" marker-end="url(#nlaArrow)"></line>
  <text x="189" y="122" text-anchor="middle" font-family="JetBrains Mono, SF Mono, Menlo, monospace" font-size="10" fill="#030303">h</text>

  <!-- COMPONENT 2: ACTIVATION VERBALIZER (encoder) -->
  <rect x="210" y="84" width="150" height="92" fill="#3D1F4A" stroke="#3D1F4A" stroke-width="2"></rect>
  <text x="285" y="112" text-anchor="middle" font-family="JetBrains Mono, SF Mono, Menlo, monospace" font-size="11" fill="#ffffff">ACTIVATION</text>
  <text x="285" y="128" text-anchor="middle" font-family="JetBrains Mono, SF Mono, Menlo, monospace" font-size="11" fill="#ffffff">VERBALIZER</text>
  <text x="285" y="150" text-anchor="middle" font-family="JetBrains Mono, SF Mono, Menlo, monospace" font-size="10" fill="#DBA844">AV . encoder</text>

  <!-- arrow into bottleneck -->
  <line x1="360" y1="130" x2="398" y2="130" stroke="#030303" stroke-width="1.5" marker-end="url(#nlaArrow)"></line>

  <!-- TEXT BOTTLENECK -->
  <text x="475" y="74" text-anchor="middle" font-family="JetBrains Mono, SF Mono, Menlo, monospace" font-size="9" letter-spacing="1" fill="#DBA844">NATURAL LANGUAGE . THE ONLY CHANNEL</text>
  <rect x="400" y="84" width="150" height="92" fill="#F5F5F7" stroke="#DBA844" stroke-width="2" stroke-dasharray="5 4"></rect>
  <text x="475" y="124" text-anchor="middle" font-family="JetBrains Mono, SF Mono, Menlo, monospace" font-size="9" fill="#030303">&#8220;The model suspects</text>
  <text x="475" y="139" text-anchor="middle" font-family="JetBrains Mono, SF Mono, Menlo, monospace" font-size="9" fill="#030303">this is an</text>
  <text x="475" y="154" text-anchor="middle" font-family="JetBrains Mono, SF Mono, Menlo, monospace" font-size="9" fill="#030303">evaluation.&#8221;</text>

  <!-- arrow out of bottleneck -->
  <line x1="550" y1="130" x2="588" y2="130" stroke="#030303" stroke-width="1.5" marker-end="url(#nlaArrow)"></line>

  <!-- COMPONENT 3: ACTIVATION RECONSTRUCTOR (decoder) -->
  <rect x="590" y="84" width="150" height="92" fill="#1A4A38" stroke="#1A4A38" stroke-width="2"></rect>
  <text x="665" y="112" text-anchor="middle" font-family="JetBrains Mono, SF Mono, Menlo, monospace" font-size="11" fill="#ffffff">ACTIVATION</text>
  <text x="665" y="128" text-anchor="middle" font-family="JetBrains Mono, SF Mono, Menlo, monospace" font-size="11" fill="#ffffff">RECONSTRUCTOR</text>
  <text x="665" y="150" text-anchor="middle" font-family="JetBrains Mono, SF Mono, Menlo, monospace" font-size="10" fill="#DBA844">AR . decoder</text>

  <!-- reconstruction comparison rails -->
  <line x1="95" y1="176" x2="95" y2="262" stroke="#0F3A6B" stroke-width="1.5"></line>
  <line x1="665" y1="176" x2="665" y2="232" stroke="#1A4A38" stroke-width="1.5"></line>
  <text x="665" y="252" text-anchor="middle" font-family="JetBrains Mono, SF Mono, Menlo, monospace" font-size="10" fill="#030303">h&#770; reconstructed</text>
  <line x1="665" y1="258" x2="665" y2="262" stroke="#1A4A38" stroke-width="1.5"></line>

  <!-- loss bracket comparing original h to reconstructed h-hat -->
  <line x1="95" y1="262" x2="665" y2="262" stroke="#030303" stroke-width="1.5" stroke-dasharray="4 3"></line>
  <text x="92" y="200" text-anchor="end" font-family="JetBrains Mono, SF Mono, Menlo, monospace" font-size="10" fill="#0F3A6B">h (original)</text>

  <!-- loss label -->
  <rect x="300" y="276" width="160" height="44" fill="#ffffff" stroke="#7A1626" stroke-width="1.5"></rect>
  <text x="380" y="296" text-anchor="middle" font-family="JetBrains Mono, SF Mono, Menlo, monospace" font-size="12" fill="#7A1626">loss = &#8214; h &#8722; h&#770; &#8214;&#178;</text>
  <text x="380" y="312" text-anchor="middle" font-family="JetBrains Mono, SF Mono, Menlo, monospace" font-size="9" fill="#030303">reconstruction fidelity only</text>

  <text x="475" y="296" text-anchor="start" font-family="JetBrains Mono, SF Mono, Menlo, monospace" font-size="9" fill="#030303" opacity="0.75">RL training signal .</text>
  <text x="475" y="310" text-anchor="start" font-family="JetBrains Mono, SF Mono, Menlo, monospace" font-size="9" fill="#030303" opacity="0.75">no human labels</text>
</svg>
