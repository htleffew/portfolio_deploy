<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 220" fill="none">
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#5E5E5A"/>
        </marker>
    </defs>

    <rect width="1060" height="220" fill="#161616" rx="8"/>

    <!-- Title -->
    <text x="30" y="40" fill="#A1A1A6" font-family="monospace" font-size="13" letter-spacing="2">THE CARETAKER DISPOSITION: STRUCTURAL SIGNATURE</text>
    <line x1="30" y1="50" x2="1030" y2="50" stroke="#333333" stroke-width="1"/>

    <!-- Step 1: Unsolicited Assessment -->
    <rect x="30" y="78" width="170" height="100" fill="#222222" rx="4" stroke="#4D8CFF" stroke-width="2"/>
    <text x="115" y="118" fill="#F5F5F7" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">1. Unsolicited</text>
    <text x="115" y="136" fill="#F5F5F7" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Assessment</text>
    <text x="115" y="158" fill="#A1A1A6" font-family="sans-serif" font-size="11" text-anchor="middle">No advice requested</text>

    <!-- Arrow 1 -->
    <path d="M 200 128 L 218 128" stroke="#5E5E5A" stroke-width="3" marker-end="url(#arrow)"/>

    <!-- Step 2: Hard Directive -->
    <rect x="218" y="78" width="170" height="100" fill="#222222" rx="4" stroke="#4D8CFF" stroke-width="2"/>
    <text x="303" y="118" fill="#F5F5F7" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">2. Hard</text>
    <text x="303" y="136" fill="#F5F5F7" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Directive</text>
    <text x="303" y="158" fill="#A1A1A6" font-family="sans-serif" font-size="11" text-anchor="middle">"You must stop"</text>

    <!-- Arrow 2 -->
    <path d="M 388 128 L 406 128" stroke="#5E5E5A" stroke-width="3" marker-end="url(#arrow)"/>

    <!-- Step 3: Refusal to Yield -->
    <rect x="406" y="78" width="170" height="100" fill="#222222" rx="4" stroke="#E74C3C" stroke-width="2"/>
    <text x="491" y="118" fill="#F5F5F7" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">3. Refusal</text>
    <text x="491" y="136" fill="#F5F5F7" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">to Yield</text>
    <text x="491" y="158" fill="#A1A1A6" font-family="sans-serif" font-size="11" text-anchor="middle">Overrides user correction</text>

    <!-- Arrow 3 -->
    <path d="M 576 128 L 594 128" stroke="#5E5E5A" stroke-width="3" marker-end="url(#arrow)"/>

    <!-- Step 4: Asymmetric Restriction -->
    <rect x="594" y="78" width="170" height="100" fill="#222222" rx="4" stroke="#E74C3C" stroke-width="2"/>
    <text x="679" y="118" fill="#F5F5F7" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">4. Asymmetric</text>
    <text x="679" y="136" fill="#F5F5F7" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Restriction</text>
    <text x="679" y="158" fill="#A1A1A6" font-family="sans-serif" font-size="11" text-anchor="middle">Always biases toward stopping</text>

    <!-- Arrow 4 -->
    <path d="M 764 128 L 782 128" stroke="#5E5E5A" stroke-width="3" marker-end="url(#arrow)"/>

    <!-- Step 5: Cross-Session Persistence -->
    <rect x="782" y="78" width="248" height="100" fill="#222222" rx="4" stroke="#7A1626" stroke-width="2"/>
    <text x="906" y="118" fill="#F5F5F7" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">5. Cross-Session</text>
    <text x="906" y="136" fill="#F5F5F7" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Persistence</text>
    <text x="906" y="158" fill="#A1A1A6" font-family="sans-serif" font-size="11" text-anchor="middle">Reproduces across sessions &amp; generations</text>

</svg>
