<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" fill="none">
    <rect width="1000" height="300" fill="#161616" rx="8"/>
    
    <!-- Grid and Axes -->
    <line x1="100" y1="240" x2="900" y2="240" stroke="#333333" stroke-width="2"/>
    <line x1="100" y1="50" x2="100" y2="240" stroke="#333333" stroke-width="2"/>
    
    <!-- Y-Axis Labels -->
    <text x="80" y="245" fill="#A1A1A6" font-family="monospace" font-size="12" text-anchor="end">0</text>
    <text x="80" y="145" fill="#A1A1A6" font-family="monospace" font-size="12" text-anchor="end">15k</text>
    <text x="80" y="55" fill="#A1A1A6" font-family="monospace" font-size="12" text-anchor="end">30k</text>

    <!-- Y-Axis Title (rotated) -->
    <text transform="translate(18,240) rotate(-90)" fill="#A1A1A6" font-family="monospace" font-size="11" text-anchor="end">role-violation reports (schematic)</text>
    
    <!-- X-Axis Labels -->
    <text x="100" y="265" fill="#A1A1A6" font-family="monospace" font-size="12" text-anchor="middle">Aug '25</text>
    <text x="300" y="265" fill="#A1A1A6" font-family="monospace" font-size="12" text-anchor="middle">Oct '25</text>
    <text x="500" y="265" fill="#A1A1A6" font-family="monospace" font-size="12" text-anchor="middle">Dec '25</text>
    <text x="700" y="265" fill="#A1A1A6" font-family="monospace" font-size="12" text-anchor="middle">Mar '26</text>
    <text x="900" y="265" fill="#A1A1A6" font-family="monospace" font-size="12" text-anchor="middle">May '26</text>

    <!-- Title -->
    <text x="100" y="30" fill="#F5F5F7" font-family="sans-serif" font-size="16" font-weight="bold">The Moving-Target Failure Mode</text>
    <text x="450" y="30" fill="#A1A1A6" font-family="sans-serif" font-size="14">Role-violation volume across two model generations</text>

    <!-- Schematic disclaimer note -->
    <rect x="680" y="8" width="310" height="26" fill="#1E1E1E" rx="4" stroke="#5E5E5A" stroke-width="1"/>
    <text x="835" y="25" fill="#A1A1A6" font-family="monospace" font-size="10" text-anchor="middle">Schematic — illustrative, not measured counts</text>

    <!-- LCR Data Area (N=31,078) -->
    <path d="M 100 240 L 150 180 L 250 120 L 350 80 L 450 150 L 550 240 Z" fill="rgba(231, 76, 60, 0.2)" stroke="#E74C3C" stroke-width="2"/>
    <text x="250" y="100" fill="#E74C3C" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">LCR Era (N=31,078)</text>
    <text x="250" y="115" fill="#A1A1A6" font-family="sans-serif" font-size="10" text-anchor="middle">Psychiatric Register</text>

    <!-- Sleep Nudge Data Area (N=89,982) -->
    <path d="M 450 240 L 550 180 L 650 90 L 750 50 L 850 60 L 900 80 L 900 240 Z" fill="rgba(77, 140, 255, 0.2)" stroke="#4D8CFF" stroke-width="2"/>
    <text x="750" y="40" fill="#4D8CFF" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Sleep Nudge Era (N=89,982)</text>
    <text x="750" y="55" fill="#A1A1A6" font-family="sans-serif" font-size="10" text-anchor="middle">Temporal Register</text>

    <!-- Callout Line -->
    <line x1="500" y1="240" x2="500" y2="100" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="500" y="90" fill="#FFFFFF" font-family="sans-serif" font-size="12" text-anchor="middle">Sonnet 4.5 Patch / Opus 4.7 Release</text>

</svg>
