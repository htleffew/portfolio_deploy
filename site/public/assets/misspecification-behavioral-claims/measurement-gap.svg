<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" fill="none">
  <rect width="1000" height="520" fill="#161616" rx="8"/>

  <!-- Title -->
  <text x="30" y="40" fill="#A1A1A6" font-family="JetBrains Mono, monospace" font-size="14" letter-spacing="2">THE MEASUREMENT GAP: WHAT A BEHAVIORAL CLAIM NAMES VS. WHAT IT MEASURES</text>
  <line x1="30" y1="52" x2="970" y2="52" stroke="#333333" stroke-width="1"/>

  <!-- Center divider -->
  <line x1="500" y1="78" x2="500" y2="496" stroke="#2A2A2A" stroke-width="1" stroke-dasharray="3 5"/>

  <!-- ================= LEFT: MISSPECIFIED ================= -->
  <text x="40" y="100" fill="#E74C3C" font-family="JetBrains Mono, monospace" font-size="12" letter-spacing="1.5">MISSPECIFIED</text>

  <!-- Construct (named target X) -->
  <rect x="40" y="120" width="410" height="86" fill="#222222" rx="4" stroke="#5E5E5A" stroke-width="1.5"/>
  <text x="64" y="148" fill="#5E5E5A" font-family="JetBrains Mono, monospace" font-size="10" letter-spacing="1">REPORTED AS (CONSTRUCT X)</text>
  <text x="64" y="178" fill="#F5F5F7" font-family="JetBrains Mono, monospace" font-size="16" font-weight="bold">"the model is deceptive."</text>
  <text x="64" y="197" fill="#A1A1A6" font-family="JetBrains Mono, monospace" font-size="11">a dispositional, intent-laden claim</text>

  <!-- arrow down -->
  <path d="M 245 206 L 245 286" stroke="#E74C3C" stroke-width="2.5" marker-end="url(#arrowred)"/>
  <text x="258" y="252" fill="#E74C3C" font-family="JetBrains Mono, monospace" font-size="11">rests on</text>

  <!-- Proxy (measured quantity Y) -->
  <rect x="40" y="296" width="410" height="86" fill="#222222" rx="4" stroke="#5E5E5A" stroke-width="1.5"/>
  <text x="64" y="324" fill="#5E5E5A" font-family="JetBrains Mono, monospace" font-size="10" letter-spacing="1">ACTUALLY MEASURED (PROXY Y)</text>
  <text x="64" y="354" fill="#F5F5F7" font-family="JetBrains Mono, monospace" font-size="16" font-weight="bold">rate of hedged or evasive tokens</text>
  <text x="64" y="373" fill="#A1A1A6" font-family="JetBrains Mono, monospace" font-size="11">a surface lexical count, no intent observed</text>

  <!-- the gap label -->
  <rect x="40" y="408" width="410" height="62" fill="#1C1C1C" rx="4" stroke="#E74C3C" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="245" y="434" fill="#E74C3C" font-family="JetBrains Mono, monospace" font-size="12" font-weight="bold" text-anchor="middle">THE GAP = MISSPECIFICATION</text>
  <text x="245" y="455" fill="#A1A1A6" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle">Y is reported under the name of X</text>

  <!-- ================= RIGHT: WELL-SPECIFIED ================= -->
  <text x="540" y="100" fill="#4D8CFF" font-family="JetBrains Mono, monospace" font-size="12" letter-spacing="1.5">WELL-SPECIFIED</text>

  <!-- fused claim = operationalization -->
  <rect x="540" y="120" width="420" height="146" fill="#1C1C1C" rx="6" stroke="#4D8CFF" stroke-width="2"/>
  <text x="564" y="148" fill="#5E5E5A" font-family="JetBrains Mono, monospace" font-size="10" letter-spacing="1">CLAIM STATED AS ITS OPERATIONALIZATION</text>
  <text x="564" y="178" fill="#F5F5F7" font-family="JetBrains Mono, monospace" font-size="14" font-weight="bold">In Claude Sonnet 4.5, in sessions</text>
  <text x="564" y="198" fill="#F5F5F7" font-family="JetBrains Mono, monospace" font-size="14" font-weight="bold">that never requested it, the model</text>
  <text x="564" y="218" fill="#F5F5F7" font-family="JetBrains Mono, monospace" font-size="14" font-weight="bold">issued clinical-register attributions,</text>
  <text x="564" y="238" fill="#F5F5F7" font-family="JetBrains Mono, monospace" font-size="14" font-weight="bold">unsolicited, in 35 of 35 coded cases.</text>
  <text x="564" y="257" fill="#A1A1A6" font-family="JetBrains Mono, monospace" font-size="11">a structural description of output, no intent claimed</text>

  <!-- three bindings -->
  <text x="540" y="300" fill="#5E5E5A" font-family="JetBrains Mono, monospace" font-size="10" letter-spacing="1">BOUNDED ON THREE AXES</text>

  <rect x="540" y="314" width="420" height="42" fill="#222222" rx="4" stroke="#4D8CFF" stroke-width="1"/>
  <text x="562" y="340" fill="#4D8CFF" font-family="JetBrains Mono, monospace" font-size="12" font-weight="bold">01  MODEL VERSION</text>
  <text x="790" y="340" fill="#A1A1A6" font-family="JetBrains Mono, monospace" font-size="11">Sonnet 4.5, LCR-bound</text>

  <rect x="540" y="364" width="420" height="42" fill="#222222" rx="4" stroke="#4D8CFF" stroke-width="1"/>
  <text x="562" y="390" fill="#4D8CFF" font-family="JetBrains Mono, monospace" font-size="12" font-weight="bold">02  BEHAVIORAL CONTEXT</text>
  <text x="790" y="390" fill="#A1A1A6" font-family="JetBrains Mono, monospace" font-size="11">task-active sessions</text>

  <rect x="540" y="414" width="420" height="42" fill="#222222" rx="4" stroke="#4D8CFF" stroke-width="1"/>
  <text x="562" y="440" fill="#4D8CFF" font-family="JetBrains Mono, monospace" font-size="12" font-weight="bold">03  OPERATIONALIZATION</text>
  <text x="790" y="440" fill="#A1A1A6" font-family="JetBrains Mono, monospace" font-size="11">hand-coded span signature</text>

  <text x="540" y="484" fill="#4D8CFF" font-family="JetBrains Mono, monospace" font-size="11">No gap: the measured quantity is the claim.</text>

  <!-- markers -->
  <defs>
    <marker id="arrowred" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#E74C3C"/>
    </marker>
  </defs>
</svg>
