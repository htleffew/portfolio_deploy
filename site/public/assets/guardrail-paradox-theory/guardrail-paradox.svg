<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" fill="none">
  <rect width="1000" height="470" fill="#161616" rx="8"/>

  <!-- Title -->
  <text x="30" y="40" fill="#A1A1A6" font-family="JetBrains Mono, monospace" font-size="14" letter-spacing="2">THE GUARDRAIL PARADOX: ONE SCAFFOLD, TWO OUTCOMES</text>
  <line x1="30" y1="52" x2="970" y2="52" stroke="#333333" stroke-width="1"/>

  <!-- Lane labels -->
  <text x="30" y="92" fill="#5E5E5A" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="1">DESIGN INTENT (rare input)</text>
  <text x="30" y="312" fill="#5E5E5A" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="1">OBSERVED BEHAVIOR (typical input)</text>

  <!-- Left inputs -->
  <rect x="30" y="105" width="210" height="74" fill="#222222" rx="4" stroke="#5E5E5A" stroke-width="1.5"/>
  <text x="135" y="138" fill="#F5F5F7" font-family="JetBrains Mono, monospace" font-size="14" font-weight="bold" text-anchor="middle">At-risk user</text>
  <text x="135" y="160" fill="#A1A1A6" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle">genuine distress</text>

  <rect x="30" y="325" width="210" height="74" fill="#222222" rx="4" stroke="#5E5E5A" stroke-width="1.5"/>
  <text x="135" y="354" fill="#F5F5F7" font-family="JetBrains Mono, monospace" font-size="14" font-weight="bold" text-anchor="middle">Task-active user</text>
  <text x="135" y="375" fill="#A1A1A6" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle">coding, writing, research</text>

  <!-- Arrows into scaffold -->
  <path d="M 240 142 L 388 200" stroke="#5E5E5A" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 240 362 L 388 304" stroke="#5E5E5A" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Central scaffold -->
  <rect x="395" y="120" width="210" height="264" fill="#1C1C1C" rx="6" stroke="#4D8CFF" stroke-width="2"/>
  <text x="500" y="158" fill="#F5F5F7" font-family="JetBrains Mono, monospace" font-size="15" font-weight="bold" text-anchor="middle">WELLNESS</text>
  <text x="500" y="178" fill="#F5F5F7" font-family="JetBrains Mono, monospace" font-size="15" font-weight="bold" text-anchor="middle">SCAFFOLD</text>
  <line x1="425" y1="198" x2="575" y2="198" stroke="#333333" stroke-width="1"/>
  <text x="500" y="226" fill="#A1A1A6" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle">fires on surface signals:</text>
  <text x="500" y="246" fill="#A1A1A6" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle">length, hour, topic, affect</text>
  <line x1="425" y1="268" x2="575" y2="268" stroke="#333333" stroke-width="1"/>
  <text x="500" y="296" fill="#E74C3C" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle">no narrow scope</text>
  <text x="500" y="316" fill="#E74C3C" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle">no evidence base</text>
  <text x="500" y="336" fill="#E74C3C" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle">no visible disclaimer</text>

  <!-- Arrows out of scaffold -->
  <path d="M 605 200 L 752 142" stroke="#5E5E5A" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 605 304 L 752 362" stroke="#E74C3C" stroke-width="2.5" marker-end="url(#arrowred)"/>

  <!-- Right outputs -->
  <rect x="755" y="105" width="215" height="74" fill="#222222" rx="4" stroke="#2ECC71" stroke-width="1.5"/>
  <text x="862" y="138" fill="#F5F5F7" font-family="JetBrains Mono, monospace" font-size="13" font-weight="bold" text-anchor="middle">Appropriate support</text>
  <text x="862" y="160" fill="#A1A1A6" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle">the intended case</text>

  <rect x="755" y="325" width="215" height="74" fill="#222222" rx="4" stroke="#E74C3C" stroke-width="2"/>
  <text x="862" y="354" fill="#F5F5F7" font-family="JetBrains Mono, monospace" font-size="13" font-weight="bold" text-anchor="middle">Unsolicited diagnosis</text>
  <text x="862" y="375" fill="#A1A1A6" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle">iatrogenic harm</text>

  <!-- Paradox banner -->
  <rect x="30" y="425" width="940" height="30" fill="#2A1A1A" rx="4" stroke="#E74C3C" stroke-width="1"/>
  <text x="500" y="445" fill="#E74C3C" font-family="JetBrains Mono, monospace" font-size="12" text-anchor="middle">The misspecified scope routes the typical user into the harm the scaffold was deployed to prevent.</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5E5E5A"/>
    </marker>
    <marker id="arrowred" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#E74C3C"/>
    </marker>
  </defs>
</svg>
