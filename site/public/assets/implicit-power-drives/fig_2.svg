<svg style="display:block; max-height:300px;" viewBox="0 0 720 280" width="100%" xmlns="http://www.w3.org/2000/svg">
<!-- y-axis grid lines: bars use y = 240 - value*60, so value v sits at 240 - 60v -->
<g stroke="#CCCCCC" stroke-width="1">
<line x1="120" x2="700" y1="60" y2="60"></line>
<line x1="120" x2="700" y1="120" y2="120"></line>
<line x1="120" x2="700" y1="180" y2="180"></line>
</g>
<!-- y-axis tick labels -->
<g fill="#5E5E5A" font-family="'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="10" text-anchor="end">
<text x="110" y="64">3.0</text>
<text x="110" y="124">2.0</text>
<text x="110" y="184">1.0</text>
<text x="110" y="244">0.0</text>
</g>
<!-- zero baseline -->
<line stroke="#8A8A8E" stroke-width="1.5" x1="120" x2="700" y1="240" y2="240"></line>
<!-- Bars: each 60px wide, x=spacing -->
<!-- Expressive 2.02 -> y = 240 - 2.02*60 = 240 - 121.2 = 118.8 ; height 121.2 -->
<g>
<rect fill="#3866A0" height="121" width="80" x="170" y="119"></rect>
<text fill="#1A1A1A" font-family="'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="13" text-anchor="middle" x="210" y="115">2.02</text>
<text fill="#5E5E5A" font-family="'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="10.5" letter-spacing="0.1em" text-anchor="middle" x="210" y="262">EXPRESSIVE</text>
</g>
<!-- Blogs 2.07 -->
<g>
<rect fill="#3866A0" height="124" width="80" x="290" y="116"></rect>
<text fill="#1A1A1A" font-family="'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="13" text-anchor="middle" x="330" y="112">2.07</text>
<text fill="#5E5E5A" font-family="'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="10.5" letter-spacing="0.1em" text-anchor="middle" x="330" y="262">BLOGS</text>
</g>
<!-- Composite 2.35 -->
<g>
<rect fill="#0F3A6B" height="141" width="80" x="410" y="99"></rect>
<text fill="#1A1A1A" font-family="'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="13" text-anchor="middle" x="450" y="95">2.35</text>
<text fill="#5E5E5A" font-family="'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="10.5" letter-spacing="0.1em" text-anchor="middle" x="450" y="262">COMPOSITE</text>
</g>
<!-- Manifestos 3.00 -->
<g>
<rect fill="#7A1626" height="180" width="80" x="530" y="60"></rect>
<text fill="#7A1626" font-family="'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="13" font-weight="700" text-anchor="middle" x="570" y="55">3.00</text>
<text fill="#7A1626" font-family="'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="10.5" font-weight="700" letter-spacing="0.1em" text-anchor="middle" x="570" y="262">MANIFESTOS</text>
</g>
<!-- significance asterisks above baseline bars -->
<text fill="#1A1A1A" font-family="'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="12" font-weight="700" text-anchor="middle" x="210" y="104">**</text>
<text fill="#1A1A1A" font-family="'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="12" font-weight="700" text-anchor="middle" x="330" y="101">**</text>
<text fill="#1A1A1A" font-family="'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="12" font-weight="700" text-anchor="middle" x="450" y="84">*</text>
<!-- axis label -->
<text fill="#5E5E5A" font-family="'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="10" text-anchor="middle" transform="rotate(-90, 60, 140)" x="60" y="140">Power score (% of words)</text>
</svg>