<line stroke="#0F3A6B" stroke-opacity="0.3" stroke-width="0.5" x1="80" x2="80" y1="10" y2="120"></line>
<line stroke="#0F3A6B" stroke-opacity="0.3" stroke-width="0.5" x1="80" x2="760" y1="120" y2="120"></line>
<text fill="#0F3A6B" font-family="'JetBrains Mono','SF Mono',Menlo,monospace" font-size="8" text-anchor="end" x="70" y="18">h</text>
<text fill="#0F3A6B" font-family="'JetBrains Mono','SF Mono',Menlo,monospace" font-size="8" text-anchor="end" x="70" y="120">0</text>
<text fill="#3D1F4A" font-family="'JetBrains Mono','SF Mono',Menlo,monospace" font-size="9" letter-spacing="1" text-anchor="middle" transform="rotate(-90,20,65)" x="20" y="65">S_t</text>
<!-- Threshold line -->
<line stroke="#7A1626" stroke-dasharray="6 4" stroke-opacity="0.5" stroke-width="1" x1="80" x2="760" y1="20" y2="20"></line>
<text fill="#7A1626" fill-opacity="0.7" font-family="'JetBrains Mono','SF Mono',Menlo,monospace" font-size="7" text-anchor="start" x="765" y="18">h</text>
