<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}} | Dr. Heather Leffew</title>
    <!-- Design System: tokens load via @import inside institutional.css -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/simplex-noise/2.4.0/simplex-noise.min.js" defer></script>
    <link rel="stylesheet" href="../portfolio_deploy/design_system/css/global.css">
    <style>
      /* Editorial Layout for reading column */
      .markdown-body { 
          max-width: 65ch;
          margin: 1.5rem auto 0 auto;
          padding: 0 1.5rem;
      }
      .markdown-body > * {
          /* OVERRIDE global.css centering to restore elegant flush-left alignment */
          margin-left: 0 !important;
          margin-right: 0 !important;
          padding-left: 0 !important;
          padding-right: 0 !important;
          max-width: none !important;
          text-align: left !important;
      }
      .markdown-body p { margin-bottom: 1.5em; font-size: 1.125rem; line-height: 1.8; color: var(--charcoal); }
      
      .markdown-body h2 {
          margin-top: 2rem;
          margin-bottom: 1.5rem;
          font-family: var(--font-display);
          font-weight: 600;
          font-size: 2.2rem;
          border-bottom: 1px solid var(--tungsten);
          padding-bottom: 0.5rem !important;
          color: var(--obsidian);
      }
      .markdown-body h3 {
          margin-top: 2rem;
          margin-bottom: 1rem;
          font-family: var(--font-display);
          font-size: 1.5rem;
          color: var(--obsidian);
      }
      .markdown-body .eyebrow {
          color: var(--phthalo-lift);
          font-family: var(--font-mono);
          letter-spacing: 0.1em;
          text-transform: uppercase;
          margin-top: 1rem;
          margin-bottom: -0.5rem; /* pull up near h2 */
      }
      
      /* Override massive cinematic padding for article content sections */
      section.band {
          padding: 2rem 0 !important;
      }
      
      /* Media Bleeds into the right gutter for editorial flair */
      .markdown-body img, .markdown-body figure {
          grid-column: 2 / 4; 
          width: 100%;
          max-width: 100%;
          height: auto; 
          display: block; 
          margin: 3em 0; 
          border-radius: var(--radius-sm);
          box-shadow: var(--shadow-card);
      }
      .markdown-body pre { 
          grid-column: 1 / -1; /* Code blocks span full width */
          padding: 2em; 
          overflow-x: auto; 
          background: var(--obsidian); 
          border: 1px solid var(--brushed); 
          margin: 3em 0; 
          border-radius: var(--radius-sm);
      }
      .markdown-body code { font-family: var(--font-mono); font-size: 0.85em; color: var(--phthalo-lift); }
      .markdown-body pre code { color: var(--platinum); }
      
      .markdown-body blockquote {
          grid-column: 2;
          font-style: italic;
          font-size: 1.35rem;
          border-left: 3px solid var(--phthalo-lift);
          padding-left: 1.5rem;
          margin: 2.5rem 0;
          color: var(--charcoal);
      }
      .markdown-body ul, .markdown-body ol {
          grid-column: 2;
          margin-bottom: 1.5em;
          padding-left: 1.5rem;
          color: var(--charcoal);
      }
      .markdown-body li {
          margin-bottom: 0.5em;
      }
      .has-dropcap::first-letter {
          font-family: var(--font-display);
          float: left;
          font-size: 4.5rem;
          line-height: 0.8;
          padding-top: 6px;
          padding-right: 12px;
          color: var(--obsidian);
      }
    </style>
</head>

<body data-category="{{CATEGORY}}" data-title="{{SHORT_TITLE}}">

<!-- Reading progress -->
<div id="progress"></div>

<!-- Top nav (injected by global_chrome.js) -->
<div id="global-nav-container"></div>

<!-- Chapter spine (populated by global_chrome.js) -->
<aside id="spine"></aside>

<!-- Atmospheric gradient -->
<div class="atmosphere"></div>

<canvas id="glCanvas"></canvas>

<!-- FRONT MATTER -->
<section class="band band--dark front" data-spine="Front" data-section="Front matter">
  <div class="col-wide">
    <div class="grid">
     <div>
      <div class="meta-row">
        <span class="bracket">{{FORMAT}}</span>
        <span class="sep">/</span>
        <span>{{CATEGORY}}</span>
        <span class="sep">/</span>
        <span>{{SUBCATEGORY}}</span>
      </div>

      <h1>{{HEADLINE}}</h1>

      <p class="abstract">
        {{ABSTRACT}}
      </p>

      <div class="byline">
        {{BYLINE}}
      </div>
     </div>
     <div></div>
    </div>
  </div>
</section>

<!-- INJECTED MARKDOWN CONTENT -->
{{CONTENT}}

<!-- BACK MATTER: Related Works -->
<section class="band band--dark back-matter" data-spine="Research Graph" data-section="Research Graph">
  <div class="back-matter" style="padding-top:0;">
    <h3 style="margin-bottom:22px;">Related Works</h3>
    <div class="related">
      <div class="related-grid" id="recommendation-grid">
        <!-- Populated by global_chrome.js from projects_index.json -->
      </div>
    </div>
  </div>

  <a class="next-chap" id="next-chap-link" href="#">
    <div class="lf">
      <div class="eb">Next Publication</div>
      <div class="ti" id="next-chap-title">Loading...</div>
    </div>
    <div class="rt">&rarr;</div>
  </a>
</section>

<!-- INJECTED SCRIPTS -->
{{SCRIPTS}}

<!-- GLOBAL CHROME -->
<!-- Need relative pathing adjustment based on actual file depth, defaulting to root pathing for now -->
<script src="../portfolio_deploy/design_system/js/global.js" defer></script>
</body>
</html>
