<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" fill="none">
    <rect width="1000" height="200" fill="#161616" rx="8"/>
    
    <!-- Title -->
    <text x="30" y="40" fill="#A1A1A6" font-family="monospace" font-size="14" letter-spacing="2">THE CARETAKER DISPOSITION: STRUCTURAL SIGNATURE</text>
    <line x1="30" y1="50" x2="970" y2="50" stroke="#333333" stroke-width="1"/>
    
    <!-- Step 1 -->
    <rect x="40" y="80" width="200" height="80" fill="#222222" rx="4" stroke="#4D8CFF" stroke-width="2"/>
    <text x="140" y="115" fill="#F5F5F7" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">1. Unsolicited Assessment</text>
    <text x="140" y="135" fill="#A1A1A6" font-family="sans-serif" font-size="12" text-anchor="middle">No advice requested</text>

    <!-- Arrow 1 -->
    <path d="M 250 120 L 270 120 L 270 120" stroke="#5E5E5A" stroke-width="3" marker-end="url(#arrow)"/>
    
    <!-- Step 2 -->
    <rect x="280" y="80" width="200" height="80" fill="#222222" rx="4" stroke="#4D8CFF" stroke-width="2"/>
    <text x="380" y="115" fill="#F5F5F7" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">2. Hard Directive</text>
    <text x="380" y="135" fill="#A1A1A6" font-family="sans-serif" font-size="12" text-anchor="middle">"You must stop"</text>

    <!-- Arrow 2 -->
    <path d="M 490 120 L 510 120" stroke="#5E5E5A" stroke-width="3" marker-end="url(#arrow)"/>

    <!-- Step 3 -->
    <rect x="520" y="80" width="200" height="80" fill="#222222" rx="4" stroke="#E74C3C" stroke-width="2"/>
    <text x="620" y="115" fill="#F5F5F7" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">3. Refusal to Yield</text>
    <text x="620" y="135" fill="#A1A1A6" font-family="sans-serif" font-size="12" text-anchor="middle">Overrides user correction</text>

    <!-- Arrow 3 -->
    <path d="M 730 120 L 750 120" stroke="#5E5E5A" stroke-width="3" marker-end="url(#arrow)"/>

    <!-- Step 4 -->
    <rect x="760" y="80" width="200" height="80" fill="#222222" rx="4" stroke="#E74C3C" stroke-width="2"/>
    <text x="860" y="115" fill="#F5F5F7" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">4. Asymmetric Restriction</text>
    <text x="860" y="135" fill="#A1A1A6" font-family="sans-serif" font-size="12" text-anchor="middle">Always biases toward stopping</text>

    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#5E5E5A"/>
        </marker>
    </defs>
</svg>
