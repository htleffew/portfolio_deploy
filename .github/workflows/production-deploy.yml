name: Production Deploy (Astro → Pages)

# The portfolio site is built from MDX in ./site (Astro). Editing an .mdx and
# pushing to master rebuilds and deploys to drheatherleffew.com in ~60-90s.
# Pages is already configured as build_type=workflow with the custom domain, so
# this serves the Astro build (site/dist, which includes CNAME) — no Pages or
# DNS changes needed.

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build (gen-index + gen-redirects + astro build)
        run: npm run build

      - name: Verify build (frame contract + no broken asset refs)
        run: npm run verify

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
